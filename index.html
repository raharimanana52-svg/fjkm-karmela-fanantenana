<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FJKM KARMELA FANANTENANA PORT-BERGÉ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>.active-tab { border-bottom: 4px solid #1d4ed8; color: #1d4ed8; font-weight: bold; }</style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
    <header class="bg-blue-900 text-white shadow-md p-4">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-2 md:mb-0">
                <i class="fa-solid font-bold text-3xl fa-church text-yellow-400"></i>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold">FJKM KARMELA FANANTENANA PORT-BERGÉ</h1>
                    <p class="text-xs text-blue-200">Rakitra sy Fitantanana ny Fiangonana</p>
                </div>
            </div>
        </div>
    </header>
    <nav class="bg-white shadow border-b">
        <div class="container mx-auto flex overflow-x-auto text-sm md:text-base">
            <button onclick="switchTab('kristiana')" id="tab-kristiana" class="active-tab py-3 px-6 hover:bg-slate-50 flex items-center gap-2"><i class="fa-solid fa-users"></i> Kristiana</button>
            <button onclick="switchTab('vola')" id="tab-vola" class="py-3 px-6 text-gray-600 hover:bg-slate-50 flex items-center gap-2"><i class="fa-solid fa-wallet"></i> Vola</button>
            <button onclick="switchTab('raharaha')" id="tab-raharaha" class="py-3 px-6 text-gray-600 hover:bg-slate-50 flex items-center gap-2"><i class="fa-solid fa-calendar-days"></i> Raharaha</button>
        </div>
    </nav>
    <main class="container mx-auto p-4 md:p-6">
        <section id="sec-kristiana" class="block space-y-6">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-blue-900 mb-4">Fampidirana Mpandray / Kristiana</h2>
                <form id="form-kristiana" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div><label class="block text-xs font-semibold uppercase mb-1">Anarana sy Fanampiny</label><input type="text" id="k-anarana" required class="w-full border rounded p-2 text-sm"></div>
                    <div><label class="block text-xs font-semibold uppercase mb-1">Daty Nahaterahana</label><input type="date" id="k-daty" required class="w-full border rounded p-2 text-sm"></div>
                    <div><label class="block text-xs font-semibold uppercase mb-1">Sampana</label><select id="k-sampana" class="w-full border rounded p-2 text-sm"><option value="STK">STK</option><option value="Dorkasy">Dorkasy</option><option value="VFL">VFL</option><option value="KMT">KMT</option></select></div>
                    <div><label class="block text-xs font-semibold uppercase mb-1">Batisa?</label><select id="k-batisa" class="w-full border rounded p-2 text-sm"><option value="Eny">Eny</option><option value="Tsia">Tsia</option></select></div>
                    <div><label class="block text-xs font-semibold uppercase mb-1">Mpandray?</label><select id="k-mpandray" class="w-full border rounded p-2 text-sm"><option value="Eny">Eny</option><option value="Tsia">Tsia</option></select></div>
                    <div><label class="block text-xs font-semibold uppercase mb-1">Andraikitra</label><input type="text" id="k-andraikitra" class="w-full border rounded p-2 text-sm"></div>
                    <div class="md:col-span-2"><label class="block text-xs font-semibold uppercase mb-1">Adidy</label><input type="text" id="k-adidy" class="w-full border rounded p-2 text-sm"></div>
                    <div class="flex items-end"><button type="submit" class="w-full bg-blue-700 text-white font-bold py-2 px-4 rounded">Ampidiro</button></div>
                </form>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border">
                <h3 class="font-bold mb-3">Lisi-pantin'ny Kristiana</h3>
                <table class="w-full text-left text-sm"><tbody id="list-kristiana"></tbody></table>
            </div>
        </section>
        <section id="sec-vola" class="hidden space-y-6"><div class="bg-white p-6 rounded-lg shadow-sm border"><h3 class="font-bold mb-3">Vola</h3></div></section>
        <section id="sec-raharaha" class="hidden space-y-6"><div class="bg-white p-6 rounded-lg shadow-sm border"><h3 class="font-bold mb-3">Raharaha</h3></div></section>
    </main>
    <script>
        function switchTab(tab) {
            ['kristiana', 'vola', 'raharaha'].forEach(t => {
                document.getElementById('sec-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).classList.remove('active-tab');
            });
            document.getElementById('sec-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('active-tab');
        }
        document.getElementById('form-kristiana').addEventListener('submit', (e) => {
            e.preventDefault();
            const tbody = document.getElementById('list-kristiana');
            tbody.innerHTML += `<tr class="border-b"><td class="p-2">${document.getElementById('k-anarana').value}</td><td class="p-2">${document.getElementById('k-sampana').value}</td></tr>`;
            e.target.reset();
        });
    </script>
</body>
</html>
